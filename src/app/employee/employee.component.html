<table class="table table-striped table-hover">
    <thead>
      <tr>
        <th scope="col">#</th>
        <th scope="col">First</th>
        <th scope="col">Last</th>
        <th scope="col">Handle</th>
        <th scope="col">Button</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <th scope="row">{{employeeid}}</th>
        <td>{{employeename}}</td>
        <td>Otto</td>
        <td>mdo</td>
        <td><button class="btn btn-primary">{{getEmployeeDetails()}}</button></td>
      </tr>
      <tr>
        <th scope="row">2</th>
        <td>Jacob</td>
        <td>Thornton</td>
        <td>fat</td>
        <td><button class="btn btn-primary">Click me</button></td>
      </tr>
      <tr>
        <th scope="row">3</th>
        <td colspan="2">Larry the Bird</td>
        <td>twitter</td>
        <td><button class="btn btn-primary">Click me</button></td>
      </tr>
    </tbody>
  </table>
